name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --locked

      # Unit tests only. Network tests in tests/live_data.rs are #[ignore]d.
      - name: Test
        run: cargo test --locked

      # Gate on the lint groups that indicate real bugs. Style lints are
      # reported but do not fail the build.
      - name: Clippy (correctness + suspicious)
        run: cargo clippy --all-targets --locked -- -D clippy::correctness -D clippy::suspicious

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
